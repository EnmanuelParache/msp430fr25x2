[package]
name = "msp430fr25x2"
version = "0.3.0"
edition = "2021"
authors = ["Enmanuel Parache <enmanuelparache@gmail.com"]
description = "Peripheral access crate for TI MSP430FR25x2 microcontroller"
keywords = ["no-std", "msp430", "svd2rust", "embedded", "ti"]
repository = "https://github.com/EnmanuelParache/msp430fr25x2"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/msp430fr25x2"

[dependencies]
critical-section = { version = "1.2.0", optional = true }
msp430 = "0.4.1"
msp430-rt = { version = "0.4.1", optional = true }
portable-atomic = "1.14.0"
vcell = "0.1.3"

[features]
rt = ["msp430-rt/device"]

[package.metadata.docs.rs]
targets = ["msp430-none-elf"]
cargo-args = ["-Z", "build-std=core"]

[lib]
name = "msp430fr25x2"
test = false
bench = false
